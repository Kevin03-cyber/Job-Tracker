<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline: job application tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fc;--sf:#fff;--ink:#0f172a;--mute:#64748b;--line:#e1e5f2;--Applied:#4f6bff;--Interview:#ff9a1f;--Offer:#12c98d;--Rejected:#f0527c}
[data-theme=dark]{--bg:#0a0f1f;--sf:#141b33;--ink:#eef1ff;--mute:#94a0c4;--line:#252e50}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
background:radial-gradient(900px 480px at 88% -8%,color-mix(in srgb,var(--Applied) 20%,transparent),transparent),radial-gradient(700px 420px at -6% 8%,color-mix(in srgb,var(--Interview) 15%,transparent),transparent),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--Applied);outline-offset:2px}
.hidden{display:none!important}
.btn{background:linear-gradient(135deg,var(--Applied),#7b4dff);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sf);margin:6px 0 14px}
label{font-weight:600;font-size:14px}
.theme{position:fixed;right:18px;bottom:18px;z-index:9;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--sf);cursor:pointer;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
/* login */
#auth{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr}
.hero{background:linear-gradient(160deg,#0b1020,#1b2a6b 62%,#4f6bff);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.hero h1{font-size:clamp(36px,5vw,64px);line-height:1;font-weight:800;margin:0;max-width:11ch}
.hero p{margin:0;opacity:.8;max-width:34ch}
.mock{display:flex;gap:12px;align-items:center;width:min(320px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:12px;backdrop-filter:blur(6px);animation:in .7s both}
.mock:nth-child(2){animation-delay:.15s;margin-left:40px}.mock:nth-child(3){animation-delay:.3s;margin-left:80px}
.mock i{font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800}
.mock b,.mock span{display:block}.mock span{opacity:.75;font-size:14px}
@keyframes in{from{opacity:0;transform:translateX(-24px)}}
@media(prefers-reduced-motion:reduce){.mock{animation:none}}
.panel{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:350px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:30px}
.box h2{font-size:28px;margin:0 0 16px}
.msg{min-height:22px;color:#e0365f;font-weight:600;margin-bottom:8px}.msg.ok{color:#0a9a6c}
.link{background:none;border:0;padding:0;margin-top:16px;text-decoration:underline;cursor:pointer;font-weight:600}
/* app */
header{display:flex;justify-content:space-between;align-items:center;padding:18px 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px}
.logo{display:grid;gap:3px}.logo i{display:block;height:6px;border-radius:3px}
.who{display:flex;gap:14px;align-items:center;color:var(--mute)}
main{padding:0 32px 64px;max-width:1280px;margin:0 auto}
.band{display:grid;grid-template-columns:auto 1.2fr 1fr;gap:20px;margin-bottom:22px}
.band>div{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px}
.donut{display:flex;gap:18px;align-items:center}
.dwrap{position:relative;width:140px;height:140px}.dwrap svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dc b{font-size:34px;line-height:1}.dc span{color:var(--mute);font-size:13px}
.leg{display:grid;gap:6px;font-size:14px}.leg span{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:50%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:none!important;border:0!important;padding:0!important}
.tile{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile b{display:block;font-size:34px;line-height:1.05;font-weight:800}.tile span{color:var(--mute);font-size:14px}
.weeks h3{margin:0 0 12px;font-size:16px}
#wk{display:flex;align-items:flex-end;gap:10px;height:110px}
#wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--mute)}
#wk em{display:block;width:100%;min-height:4px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--Applied),#7b4dff)}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}.toolbar input{margin:0;max-width:300px}
#addform{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 180px;gap:0 14px}
#addform .wide{grid-column:1/-1}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
.lane{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c) 7%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);min-height:300px}
.lane.over{background:color-mix(in srgb,var(--c) 18%,transparent);border-style:dashed}
.lane h3{display:flex;align-items:center;gap:8px;margin:2px 4px 12px;font-size:17px}
.lane h3:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.lane h3 b{margin-left:auto;background:var(--c);color:#fff;border-radius:99px;padding:1px 10px;font-size:14px}
.empty{color:var(--mute);font-size:14px;padding:8px 4px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 0 var(--line)}
.card.drag{opacity:.4}
.top{display:flex;gap:11px;align-items:center}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.card h4{margin:0;font-size:16px;overflow-wrap:anywhere}.card .role{margin:1px 0 0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.card .notes{margin:10px 0 0;font-size:14px;overflow-wrap:anywhere;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--c) 9%,transparent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.foot button{border:0;background:var(--line);border-radius:7px;width:28px;height:28px;cursor:pointer;margin-left:4px;font-weight:700}
.foot button:disabled{opacity:.3;cursor:default}.foot .del{color:#e0365f}
@media(max-width:1000px){.band{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}
@media(max-width:900px){#auth{grid-template-columns:1fr}.hero{padding:32px}#addform{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
@media(max-width:560px){.board{grid-template-columns:1fr}.donut{flex-wrap:wrap}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Switch light or dark theme"></button>
<section id="auth">
  <div class="hero">
    <h1>Every application, in one pipeline.</h1>
    <div aria-hidden="true">
      <div class="mock" style="--c:var(--Applied)"><i>G</i><div><b>Google</b><span>SDE Intern</span></div></div>
      <div class="mock" style="--c:var(--Interview)"><i>Z</i><div><b>Zoho</b><span>Backend Developer</span></div></div>
      <div class="mock" style="--c:var(--Offer)"><i>F</i><div><b>Freshworks</b><span>Software Engineer</span></div></div>
    </div>
    <p>Track every role from the first click to the offer letter.</p>
  </div>
  <div class="panel">
    <form class="box" id="authform">
      <h2 id="title">Log in</h2>
      <div class="msg" id="msg" role="alert"></div>
      <div id="creds">
        <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="codewrap" class="hidden">
        <label for="code">6-digit code from your authenticator app</label>
        <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      </div>
      <button class="btn" id="go" type="submit">Log in</button><br>
      <button class="link" id="toggle" type="button">Create an account</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand"><span class="logo"><i style="width:26px;background:var(--Applied)"></i><i style="width:18px;background:var(--Interview)"></i><i style="width:10px;background:var(--Offer)"></i></span>Pipeline</div>
    <div class="who"><span id="who"></span><button class="btn ghost" id="logout">Log out</button></div>
  </header>
  <main>
    <section class="band">
      <div class="donut">
        <div class="dwrap"><svg id="donut" viewBox="0 0 140 140" role="img" aria-label="Applications by stage"></svg><div class="dc"><b id="dn">0</b><span>applications</span></div></div>
        <div class="leg" id="leg"></div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="weeks"><h3>Applications per week</h3><div id="wk"></div></div>
    </section>
    <div class="toolbar">
      <button class="btn" id="newbtn">Add application</button>
      <input id="q" type="search" placeholder="Search company, role or notes" aria-label="Search applications">
    </div>
    <form id="addform" class="hidden">
      <div><label for="f-company">Company</label><input id="f-company" maxlength="100" required></div>
      <div><label for="f-role">Role</label><input id="f-role" maxlength="100" required></div>
      <div><label for="f-status">Stage</label><select id="f-status"></select></div>
      <div class="wide"><label for="f-notes">Notes</label><textarea id="f-notes" rows="2" maxlength="1000"></textarea></div>
      <div class="wide"><button class="btn" type="submit">Save application</button></div>
    </form>
    <div class="board" id="board"></div>
  </main>
</div>

<script>
const AUTH = "http://127.0.0.1:5001";
const ST = ["Applied", "Interview", "Offer", "Rejected"];
let token = null, temp = null, apps = [], mode = "login";
try { token = sessionStorage.getItem("jt"); } catch (e) {}
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

/* theme */
const root = document.documentElement;
function theme(t) { root.dataset.theme = t; $("theme").textContent = t === "dark" ? "☀" : "☾"; try { localStorage.setItem("jt-theme", t); } catch (e) {} }
let t0 = null; try { t0 = localStorage.getItem("jt-theme"); } catch (e) {}
theme(t0 || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"));
$("theme").onclick = () => theme(root.dataset.theme === "dark" ? "light" : "dark");

async function call(url, method = "GET", body, authed) {
  const h = { "Content-Type": "application/json" };
  if (authed && token) h.Authorization = "Bearer " + token;
  const r = await fetch(url, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && authed) { logout("Your session ended. Log in again."); throw new Error("session"); }
  if (r.status === 429) throw new Error("Too many attempts. Wait a minute and try again.");
  if (!r.ok) throw new Error(d.error || "Something went wrong (" + r.status + ").");
  return d;
}

/* login */
function setMsg(t, ok) { $("msg").textContent = t || ""; $("msg").className = "msg" + (ok ? " ok" : ""); }
function setMode(m) {
  mode = m; const reg = m === "register";
  $("title").textContent = reg ? "Create account" : "Log in";
  $("go").textContent = reg ? "Create account" : "Log in";
  $("toggle").textContent = reg ? "I already have an account" : "Create an account";
}
$("toggle").onclick = () => { setMode(mode === "login" ? "register" : "login"); setMsg(""); };
$("authform").onsubmit = async e => {
  e.preventDefault(); setMsg("");
  try {
    if (temp) {
      const d = await call(AUTH + "/api/login/2fa", "POST", { temp_token: temp, code: $("code").value.trim() });
      return enter(d.token);
    }
    const email = $("email").value.trim(), password = $("password").value;
    if (mode === "register") {
      await call(AUTH + "/api/register", "POST", { email, password });
      setMode("login"); return setMsg("Account created. Log in to continue.", true);
    }
    const d = await call(AUTH + "/api/login", "POST", { email, password });
    if (d.two_factor_required) {
      temp = d.temp_token; $("creds").classList.add("hidden"); $("codewrap").classList.remove("hidden");
      $("code").focus(); $("go").textContent = "Verify code"; setMsg("Enter the code to finish logging in.", true);
    } else enter(d.token);
  } catch (err) {
    setMsg(err.message);
    if (/temporary/i.test(err.message)) resetAuth();
  }
};
function resetAuth() { temp = null; $("code").value = ""; $("creds").classList.remove("hidden"); $("codewrap").classList.add("hidden"); setMode(mode); }
async function enter(t) {
  token = t; try { sessionStorage.setItem("jt", t); } catch (e) {}
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  try { $("who").textContent = (await call("/api/me", "GET", null, true)).email; await load(); } catch (e) {}
}
function logout(m) {
  token = null; try { sessionStorage.removeItem("jt"); } catch (e) {}
  resetAuth(); $("password").value = "";
  $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); setMsg(m || "");
}
$("logout").onclick = () => logout();

/* board */
const lanes = {};
ST.forEach(s => {
  const lane = el("div", "lane"); lane.style.setProperty("--c", "var(--" + s + ")");
  const h = el("h3"); h.append(el("span", 0, s), el("b", 0, "0"));
  const list = el("div"); lane.append(h, list);
  lane.ondragover = e => { e.preventDefault(); lane.classList.add("over"); };
  lane.ondragleave = () => lane.classList.remove("over");
  lane.ondrop = e => {
    e.preventDefault(); lane.classList.remove("over");
    const a = apps.find(x => x.id === +e.dataTransfer.getData("text/plain"));
    if (a && a.status !== s) move(a.id, s);
  };
  lanes[s] = { list, count: h.lastChild }; $("board").append(lane);
  $("f-status").append(new Option(s, s));
});

async function load() { apps = await call("/api/applications", "GET", null, true); render(); }
$("q").oninput = () => render();

function render() {
  const q = $("q").value.trim().toLowerCase();
  ST.forEach(s => {
    const mine = apps.filter(a => a.status === s && (!q || (a.company + " " + a.role + " " + a.notes).toLowerCase().includes(q)));
    lanes[s].count.textContent = mine.length; lanes[s].list.replaceChildren();
    if (!mine.length) lanes[s].list.append(el("p", "empty", q ? "No matches." : "Drop an application here."));
    mine.forEach(a => lanes[s].list.append(card(a)));
  });
  stats();
}

function ago(d) {
  const n = Math.floor((new Date() - new Date(d + "T00:00:00")) / 864e5);
  return n <= 0 ? "Today" : n === 1 ? "Yesterday" : n < 30 ? n + " days ago" : d;
}

function card(a) {
  const c = el("div", "card"); c.draggable = true; c.style.setProperty("--c", "var(--" + a.status + ")");
  c.ondragstart = e => { e.dataTransfer.setData("text/plain", a.id); c.classList.add("drag"); };
  c.ondragend = () => c.classList.remove("drag");
  let hash = 0; for (const ch of a.company) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
  const av = el("div", "av", a.company.charAt(0).toUpperCase()); av.style.background = "hsl(" + hash + " 68% 46%)";
  const t = el("div"); t.append(el("h4", 0, a.company), el("p", "role", a.role));
  const top = el("div", "top"); top.append(av, t); c.append(top);
  if (a.notes) c.append(el("p", "notes", a.notes));
  const f = el("div", "foot"), b = el("div"), i = ST.indexOf(a.status);
  [["‹", -1, "Move back"], ["›", 1, "Move forward"]].forEach(([s, d, tip]) => {
    const x = el("button", 0, s); x.title = tip; x.setAttribute("aria-label", tip); x.disabled = !ST[i + d];
    x.onclick = () => move(a.id, ST[i + d]); b.append(x);
  });
  const del = el("button", "del", "✕"); del.title = "Delete"; del.setAttribute("aria-label", "Delete application");
  del.onclick = () => { if (confirm("Delete " + a.company + "?")) act("/api/applications/" + a.id, "DELETE"); };
  b.append(del); f.append(el("span", 0, ago(a.applied_date)), b); c.append(f);
  return c;
}

function stats() {
  const n = s => apps.filter(a => a.status === s).length, T = apps.length;
  const inPlay = n("Applied") + n("Interview"), iv = n("Interview") + n("Offer");
  $("dn").textContent = T;
  const C = 2 * Math.PI * 52; let acc = 0;
  let svg = '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--line)" stroke-width="18"/>';
  ST.forEach(s => {
    const k = n(s); if (!k) return; const len = k / T * C;
    svg += '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--' + s + ')" stroke-width="18" stroke-dasharray="' + len + " " + (C - len) + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 70 70)"><title>' + s + ": " + k + "</title></circle>";
    acc += len;
  });
  $("donut").innerHTML = svg;
  $("leg").replaceChildren(...ST.map(s => { const r = el("span", 0, s + " " + n(s)); const d = el("i"); d.style.background = "var(--" + s + ")"; r.prepend(d); return r; }));
  $("tiles").replaceChildren(...[[T, "Total applications", "--ink"], [inPlay, "Still in play", "--Applied"], [(T ? Math.round(iv / T * 100) : 0) + "%", "Reached interview", "--Interview"], [n("Offer"), "Offers", "--Offer"]].map(([v, l, c]) => {
    const t = el("div", "tile"), b = el("b", 0, v); b.style.color = "var(" + c + ")"; t.append(b, el("span", 0, l)); return t;
  }));
  const w = [0, 0, 0, 0, 0, 0], now = new Date();
  apps.forEach(a => { const d = Math.floor((now - new Date(a.applied_date + "T00:00:00")) / 864e5), k = Math.floor(d / 7); if (d >= 0 && k < 6) w[5 - k]++; });
  const max = Math.max(1, ...w);
  $("wk").replaceChildren(...w.map((v, i) => {
    const col = el("div", 0, i === 5 ? "now" : (5 - i) + "w"), bar = el("em"); bar.style.height = (v / max * 78) + "%"; bar.title = v + " applications";
    col.prepend(bar); if (v) col.prepend(el("span", 0, v)); return col;
  }));
}

async function act(url, method, body) {
  try { await call(url, method, body, true); await load(); }
  catch (e) { if (e.message !== "session") alert(e.message); }
}
const move = (id, status) => act("/api/applications/" + id, "PATCH", { status });

$("newbtn").onclick = () => { $("addform").classList.toggle("hidden"); $("f-company").focus(); };
$("addform").onsubmit = async e => {
  e.preventDefault();
  await act("/api/applications", "POST", { company: $("f-company").value, role: $("f-role").value, status: $("f-status").value, notes: $("f-notes").value });
  e.target.reset(); e.target.classList.add("hidden");
};

if (token) enter(token);
</script>
</body>
</html>
